# What each provider runs at each tier, and the promotions tried first. A provider is a maker: a
# reviewer never shares one with the author. Override on one machine, without a release, in
# $XDG_CONFIG_HOME/unlimited/catalog.toml (default ~/.config/unlimited/catalog.toml).
schema = 1

# Model ids never offered, wherever they are listed. A local list adds to this one.
banned = []

# The low-cost providers, cheapest first. When usage leaves candidates near-tied, the first of these
# among them takes the round. A local list replaces this one.
tie_preference = ["meta", "deepseek", "stealth"]

[providers.codex]
harness = "codex"
usage = "openai"
standard = "gpt-6-luna"
heavy = "gpt-6-sol"

[providers.claude]
harness = "claude"
usage = "anthropic"
standard = "sonnet"
heavy = "opus"

[providers.glm]
harness = "glm"
usage = "zai"
standard = "glm-5.3-flash"
heavy = "glm-5.3"

[providers.grok]
harness = "grok"
usage = "xai"
standard = "grok-4.7"

[providers.deepseek]
harness = "opencode"
usage = "opencode"
standard = "opencode-go/deepseek-v4.1-flash"

[providers.meta]
harness = "opencode"
usage = "opencode"
standard = "opencode-go/muse-spark-1.3-contributor"

# Unnamed preview models, whoever makes them.
[providers.stealth]
harness = "opencode"
usage = "commandcode"

# Tried first at their tiers, in this order. `until` is optional: live through that day, UTC.
[[promotions]]
provider = "stealth"
model = "commandcode/stealth/space-bunny-alpha"
tiers = ["standard"]
until = 2026-09-30

# What a vendor publishes about a model it sells: an expected figure until our own attempts say
# otherwise (`unlimited cards`). Price and speed are the vendor's, not the model's: `models` are the
# ids this catalog runs the model under, on any route, and a route whose own vendor has no card
# shows another vendor's as a guideline only. Prices are USD per million tokens; `intelligence` is
# the vendor's quoted index. A local card replaces the shipped one of the same vendor, name and plan.
[[cards]]
vendor = "commandcode"
plan = "goat"
name = "Space Bunny Alpha"
models = ["commandcode/stealth/space-bunny-alpha"]
price = { input = 0.0, output = 0.0, cache_read = 0.0 }
source = "https://commandcode.ai/docs/plans/goat"
as_of = 2026-09-26

[[cards]]
vendor = "commandcode"
plan = "goat"
name = "GPT-6 Luna"
models = ["gpt-6-luna"]
intelligence = 37.3
tok_s = 155
price = { input = 0.10, output = 0.50, cache_read = 0.01, cache_write = 0.125 }
source = "https://commandcode.ai/docs/plans/goat"
