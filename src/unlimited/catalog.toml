# Models, the vendors that offer them, bans, preferences and vendors' published figures (see
# docs/catalog.md). Override on one machine, without a release, in
# $XDG_CONFIG_HOME/unlimited/catalog.toml (default ~/.config/unlimited/catalog.toml).
schema = 2

# The tiers a model may serve: capability classes, named by whoever keeps this file. A local list
# replaces this one.
tiers = ["standard", "heavy"]

# Never offered: a provider, model, vendor or offering id. A local list adds to this one.
banned = []

# Providers preferred among near-equal candidates, most preferred first (here the cheapest). A local
# list replaces this one.
tie_preference = ["meta", "deepseek", "stealth"]

# A model: its provider (maker) and the tiers it serves. Keyed by a vendor-neutral name.
[models.gpt-6-luna]
provider = "codex"
tiers = ["standard"]

[models.gpt-6-sol]
provider = "codex"
tiers = ["heavy"]

[models.sonnet]
provider = "claude"
tiers = ["standard"]

[models.opus]
provider = "claude"
tiers = ["heavy"]

[models.glm-5-3-flash]
provider = "glm"
tiers = ["standard"]

[models.glm-5-3]
provider = "glm"
tiers = ["heavy"]

[models.grok-4-7]
provider = "grok"
tiers = ["standard"]

[models.deepseek-v4-1-flash]
provider = "deepseek"
tiers = ["standard"]

[models.muse-spark-1-3-contributor]
provider = "meta"
tiers = ["standard"]

# Unnamed preview models, whoever makes them.
[models.space-bunny-alpha]
provider = "stealth"
tiers = ["standard"]

# An offering: a vendor's route to a model. `id` is the vendor's name for it, what a caller
# launches, unique; `vendor` is whose account a use spends. `free` marks a promotion, `until` the last
# day it is offered (UTC).
[[offerings]]
id = "gpt-6-luna"
model = "gpt-6-luna"
vendor = "openai"

[[offerings]]
id = "gpt-6-sol"
model = "gpt-6-sol"
vendor = "openai"

[[offerings]]
id = "sonnet"
model = "sonnet"
vendor = "anthropic"

[[offerings]]
id = "opus"
model = "opus"
vendor = "anthropic"

[[offerings]]
id = "glm-5.3-flash"
model = "glm-5-3-flash"
vendor = "zai"

[[offerings]]
id = "glm-5.3"
model = "glm-5-3"
vendor = "zai"

[[offerings]]
id = "grok-4.7"
model = "grok-4-7"
vendor = "xai"

[[offerings]]
id = "opencode-go/deepseek-v4.1-flash"
model = "deepseek-v4-1-flash"
vendor = "opencode"

[[offerings]]
id = "opencode-go/muse-spark-1.3-contributor"
model = "muse-spark-1-3-contributor"
vendor = "opencode"

[[offerings]]
id = "commandcode/stealth/space-bunny-alpha"
model = "space-bunny-alpha"
vendor = "commandcode"
free = true
until = 2026-09-30

# What a vendor publishes about a model it sells: an expected figure until our own attempts say
# otherwise (`unlimited cards`). Price and speed are the vendor's, not the model's: `models` are the
# ids this catalog runs the model under, on any route, and a route whose own vendor has no card
# shows another vendor's as a guideline only. Prices are USD per million tokens; `intelligence` is
# the vendor's quoted index. A local card replaces the shipped one of the same vendor, name and plan.
[[cards]]
vendor = "commandcode"
plan = "goat"
name = "Space Bunny Alpha"
models = ["commandcode/stealth/space-bunny-alpha"]
price = { input = 0.0, output = 0.0, cache_read = 0.0 }
source = "https://commandcode.ai/docs/plans/goat"
as_of = 2026-09-26

[[cards]]
vendor = "commandcode"
plan = "goat"
name = "GPT-6 Luna"
models = ["gpt-6-luna"]
intelligence = 37.3
tok_s = 155
price = { input = 0.10, output = 0.50, cache_read = 0.01, cache_write = 0.125 }
source = "https://commandcode.ai/docs/plans/goat"
as_of = 2026-09-26

