name: Identity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The check refuses what it should
        run: bash .githooks/check-identity.test.sh
      - name: Every new commit is the owner's or a bot's
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE" 2>/dev/null; then
            range="$HEAD_SHA~1..$HEAD_SHA"
          else
            range="$BASE..$HEAD_SHA"
          fi
          bash .githooks/check-identity.sh "$range"
